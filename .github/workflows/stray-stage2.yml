name: Rebuild the Stray VM allocation and diagnostics host
on: workflow_dispatch
permissions:
  contents: read
  actions: read
concurrency:
  group: stray-stage2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  host:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: recipes
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: thebcd69/bcd-games
          ref: f811dd05a9183cda20ffd3956cb1958cafe654f7
          path: publisher
          persist-credentials: false
      - name: Select the SDK of the installed build
        run: python3 recipes/ci/duo_relink.py select
      - name: Restore the verified source and component inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = 27.2
          python3 recipes/ci/native_host.py prepare
          python3 recipes/ci/duo_relink.py inputs
      - name: Compile the Wine translation unit and verify the archive
        run: |
          brew list --versions bison >/dev/null || brew install bison
          export PATH="$(brew --prefix bison)/bin:$PATH"
          python3 recipes/ci/stage2_host.py wine
      - name: Verify the title-specific diagnostics change and relink
        run: python3 recipes/ci/stage2_host.py link
      - uses: actions/upload-artifact@v4
        with:
          name: BCD-v712-Stray-stage2-host
          path: |
            out/Madeira
            out/build.json
          if-no-files-found: error
          retention-days: 5
      - if: failure()
        name: Show compiler and configuration diagnostics
        run: |
          for f in bcd/build/ntdll-unix/obj/virtual.err bcd/archive.log bcd/wine-native-configure.log bcd/make-include.log; do
            if test -f "$f"; then tail -n 25 "$f"; fi
          done
